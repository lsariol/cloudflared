name: cloudflared

x-lighthouse:
  tier: infra

services:
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    pull_policy: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - spark

networks:
  spark:
    external: true